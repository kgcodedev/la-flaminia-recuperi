<section id="contatti">
    <h3>Contattaci</h3>
    <p>Compila il modulo sottostante per inviare un messaggio direttamente alla nostra casella email.</p>
    
    <form id="form-contatti" style="margin-top: 20px; display: flex; flex-direction: column; gap: 15px; max-width: 600px;">
        <div style="display: flex; flex-direction: column; gap: 5px;">
            <label for="nome" style="color: #ddd; font-weight: bold;">Nome e Cognome</label>
            <input type="text" id="nome" name="nome" required style="padding: 12px; background-color: #242424; border: 1px solid #333; color: #fff; border-radius: 5px;">
        </div>
        <div style="display: flex; flex-direction: column; gap: 5px;">
            <label for="email" style="color: #ddd; font-weight: bold;">Email</label>
            <input type="email" id="email" name="email" required style="padding: 12px; background-color: #242424; border: 1px solid #333; color: #fff; border-radius: 5px;">
        </div>
        <div style="display: flex; flex-direction: column; gap: 5px;">
            <label for="telefono" style="color: #ddd; font-weight: bold;">Numero di Telefono</label>
            <input type="tel" id="telefono" name="telefono" required style="padding: 12px; background-color: #242424; border: 1px solid #333; color: #fff; border-radius: 5px;">
        </div>
        <div style="display: flex; flex-direction: column; gap: 5px;">
            <label for="messaggio" style="color: #ddd; font-weight: bold;">Messaggio</label>
            <textarea id="messaggio" name="messaggio" rows="4" required style="padding: 12px; background-color: #242424; border: 1px solid #333; color: #fff; border-radius: 5px; resize: vertical;"></textarea>
        </div>
        <button type="submit" class="btn-verde" style="cursor: pointer; border: none; align-self: flex-start; margin-top: 5px;">INVIA MESSAGGIO</button>
    </form>
    <div id="form-risposta" style="margin-top: 15px; font-weight: bold;"></div>

    <script>
        document.getElementById('form-contatti').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const rispostaDiv = document.getElementById('form-risposta');
            
            rispostaDiv.style.color = '#fff';
            rispostaDiv.innerText = 'Invio in corso...';

            fetch('/invia-messaggio', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    rispostaDiv.style.color = '#38B000';
                    rispostaDiv.innerText = 'Messaggio inviato con successo! Vi ricontatteremo presto.';
                    document.getElementById('form-contatti').reset();
                } else {
                    rispostaDiv.style.color = '#ff4d4d';
                    rispostaDiv.innerText = 'Errore durante l\'invio. Riprova.';
                }
            })
            .catch(error => {
                rispostaDiv.style.color = '#ff4d4d';
                rispostaDiv.innerText = 'Errore di connessione.';
            });
        });
    </script>
</section>
